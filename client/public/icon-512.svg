<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Dominant Mic Shape -->
  <g transform="translate(136, 116)" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Mic Capsule -->
    <rect x="76" y="24" width="88" height="152" rx="44" fill="url(#primaryGrad)" fill-opacity="0.25"/>
    <!-- Mic Arc Cradle -->
    <path d="M28 124 C28 204 212 204 212 124"/>
    <!-- Stem & Base -->
    <line x1="120" y1="204" x2="120" y2="256"/>
    <line x1="64" y1="256" x2="176" y2="256"/>
  </g>

  <!-- Floating Audio Sparks / Stars -->
  <circle cx="120" cy="140" r="8" fill="#c084fc"/>
  <circle cx="392" cy="160" r="10" fill="#818cf8"/>
  <circle cx="380" cy="360" r="8" fill="#38bdf8"/>
  <circle cx="130" cy="370" r="7" fill="#a855f7"/>
</svg>
