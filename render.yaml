services:
  - type: web
    name: voice-shopping-api
    env: node
    plan: free
    buildCommand: npm ci && npm --prefix shared run build && npm --prefix server run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_ORIGIN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
