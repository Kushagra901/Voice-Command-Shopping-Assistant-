name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Audit, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (High/Critical)
        run: npm audit --audit-level=high

      - name: TypeScript typecheck (Shared, Server & Client)
        run: npm run typecheck

      - name: Build all packages (Shared, Server, Client)
        run: npm run build

      - name: Run Server tests (Vitest)
        run: npm --prefix server run test
        env:
          NODE_ENV: test
          TURSO_DATABASE_URL: file:test.db

      - name: Run Client tests (Vitest + RTL)
        run: npm --prefix client run test
        env:
          NODE_ENV: test
